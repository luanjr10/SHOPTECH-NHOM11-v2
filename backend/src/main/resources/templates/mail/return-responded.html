<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${subject}">ShopTech</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; padding: 24px; max-width: 560px; margin: 0 auto;">
<h2 style="margin-bottom: 4px;">ShopTech</h2>
<p th:text="'Xin chào ' + ${name} + '!'"></p>
<p>
    Yêu cầu <span th:text="${typeLabel}"></span> cho sản phẩm
    "<strong th:text="${productName}"></strong>" của bạn đã được
    <strong th:if="${approved}" style="color: #059669;">DUYỆT</strong>
    <strong th:unless="${approved}" style="color: #e11d48;">TỪ CHỐI</strong>.
</p>
<div th:if="${sellerResponse != ''}"
     style="background: #f9fafb; border-left: 3px solid #7c3aed; padding: 12px 16px; margin: 16px 0;">
    <p style="margin: 0 0 6px; font-weight: bold;">Phản hồi từ người bán:</p>
    <p style="margin: 0; white-space: pre-line;" th:text="${sellerResponse}"></p>
</div>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
<p style="color: #9ca3af; font-size: 11px;">Đây là email tự động, vui lòng không trả lời trực tiếp email này.</p>
</body>
</html>
