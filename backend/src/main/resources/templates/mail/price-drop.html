<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${subject}">ShopTech</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; padding: 24px; max-width: 560px; margin: 0 auto;">
<h2 style="margin-bottom: 4px;">ShopTech</h2>
<p th:text="'Xin chào ' + ${name} + '!'"></p>
<p>
    Sản phẩm "<strong th:text="${productName}"></strong>" trong danh sách yêu thích của bạn vừa giảm giá:
</p>
<p>
    <span style="text-decoration: line-through; color: #9ca3af;" th:text="${oldPrice}"></span>
    &rarr; <strong style="color: #d70018; font-size: 18px;" th:text="${newPrice}"></strong>
</p>
<p th:if="${targetReached}" style="color: #059669;">Giá đã chạm mức mong muốn của bạn.</p>
<p>
    <a th:href="${url}" style="display: inline-block; background: #d70018; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none;">Xem sản phẩm</a>
</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
<p style="color: #9ca3af; font-size: 11px;">Đây là email tự động, vui lòng không trả lời trực tiếp email này.</p>
</body>
</html>
