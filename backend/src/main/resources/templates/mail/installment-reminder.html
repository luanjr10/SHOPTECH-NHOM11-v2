<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${subject}">ShopTech</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; padding: 24px; max-width: 560px; margin: 0 auto;">
<h2 style="margin-bottom: 4px;">ShopTech</h2>
<p th:text="'Xin chào ' + ${name} + '!'"></p>
<p>
    Kỳ <span th:text="${number}"></span>/<span th:text="${months}"></span> của khoản trả góp đơn
    #<span th:text="${orderId}"></span>
    <span th:if="${overdue}" style="color: #e11d48;">đã quá hạn từ <span th:text="${due}"></span>.</span>
    <span th:unless="${overdue}">đến hạn vào <strong th:text="${due}"></strong>.</span>
</p>
<p>Số tiền cần thanh toán: <strong th:text="${amount}"></strong></p>
<p>
    <a th:href="${url}" style="display: inline-block; background: #d70018; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none;">Thanh toán ngay</a>
</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
<p style="color: #9ca3af; font-size: 11px;">Đây là email tự động, vui lòng không trả lời trực tiếp email này.</p>
</body>
</html>
