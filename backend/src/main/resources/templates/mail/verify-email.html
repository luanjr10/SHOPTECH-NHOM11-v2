<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${subject}">ShopTech</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; padding: 24px; max-width: 560px; margin: 0 auto;">
<h2 style="margin-bottom: 4px;">ShopTech</h2>
<p th:text="'Xin chào ' + ${name} + '!'"></p>
<p>Vui lòng bấm nút bên dưới để xác thực địa chỉ email của bạn.</p>
<p style="margin: 24px 0;">
    <a th:href="${url}"
       style="background: #7c3aed; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
        Xác thực email
    </a>
</p>
<p style="color: #6b7280; font-size: 13px;" th:text="'Liên kết có hiệu lực trong ' + ${minutes} + ' phút.'"></p>
<p>Nếu bạn không tạo tài khoản, hãy bỏ qua email này.</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
<p style="color: #9ca3af; font-size: 11px;">Đây là email tự động, vui lòng không trả lời trực tiếp email này.</p>
</body>
</html>
