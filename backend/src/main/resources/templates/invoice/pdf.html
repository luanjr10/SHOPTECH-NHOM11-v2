<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${invoice.invoiceNo}">Hoá đơn</title>
    <style>
        @page { size: A4; margin: 18mm 14mm; }
        body { font-family: 'DejaVu Sans', sans-serif; font-size: 11px; color: #1f2937; }
        h1 { font-size: 20px; margin: 0 0 2px; }
        .muted { color: #6b7280; }
        .header { width: 100%; margin-bottom: 16px; }
        .header td { vertical-align: top; }
        .status {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 10px; font-weight: bold; color: #fff; background: #6366f1;
        }
        .status-completed { background: #059669; }
        .status-cancelled { background: #dc2626; }
        .status-paid { background: #2563eb; }
        table.info { width: 100%; margin-bottom: 16px; border-collapse: collapse; }
        table.info td { padding: 4px 0; vertical-align: top; width: 50%; }
        table.items { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        table.items th {
            background: #f3f4f6; text-align: left; padding: 6px 8px; font-size: 10px;
            border-bottom: 1px solid #d1d5db;
        }
        table.items td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
        .text-right { text-align: right; }
        .store-title { font-weight: bold; background: #eef2ff; padding: 5px 8px; margin-top: 12px; }
        table.totals { width: 100%; margin-top: 10px; }
        table.totals td { padding: 3px 0; }
        table.totals .label { color: #6b7280; }
        table.totals .grand td { font-size: 13px; font-weight: bold; border-top: 1px solid #d1d5db; padding-top: 6px; }
        .footer { margin-top: 24px; font-size: 9px; color: #9ca3af; text-align: center; }
    </style>
</head>
<body>
<table class="header">
    <tr>
        <td>
            <h1>ShopTech</h1>
            <div class="muted">Hóa đơn bán hàng</div>
        </td>
        <td class="text-right">
            <div><strong>Số hóa đơn:</strong> <span th:text="${invoice.invoiceNo}"></span></div>
            <div class="muted">Ngày xuất: <span th:text="${fmt.dateTime(invoice.issuedAt)}"></span></div>
            <div style="margin-top: 6px;">
                <span th:class="'status status-' + ${invoice.status}" th:text="${invoice.statusLabel}"></span>
            </div>
        </td>
    </tr>
</table>

<table class="info">
    <tr>
        <td>
            <strong>Khách hàng</strong><br/>
            <span th:text="${invoice.customer.name}"></span><br/>
            <span th:text="${invoice.customer.email}"></span><br/>
            <span th:text="${invoice.customer.phone ?: '—'}"></span>
        </td>
        <td>
            <strong>Giao đến</strong><br/>
            <span th:text="${invoice.receiver.name + ' — ' + invoice.receiver.phone}"></span><br/>
            <span th:text="${invoice.receiver.address}"></span>
        </td>
    </tr>
    <tr>
        <td colspan="2" style="padding-top: 8px;">
            <strong>Phương thức thanh toán:</strong> <span th:text="${fmt.upper(invoice.paymentMethod)}"></span>
            <th:block th:if="${invoice.paidAt != null}">
                &#160;·&#160; <strong>Đã thanh toán:</strong> <span th:text="${fmt.dateTime(invoice.paidAt)}"></span>
            </th:block>
        </td>
    </tr>
</table>

<th:block th:each="group : ${invoice.groups}">
    <div class="store-title" th:text="'Gian hàng: ' + ${group.storeName} + ' — ' + ${group.statusLabel}"></div>
    <table class="items">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>SKU</th>
            <th class="text-right">Đơn giá</th>
            <th class="text-right">SL</th>
            <th class="text-right">Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${group.items}">
            <td th:text="${item.name}"></td>
            <td th:text="${item.sku ?: '—'}"></td>
            <td class="text-right" th:text="${fmt.money(item.unitPrice)}"></td>
            <td class="text-right" th:text="${item.quantity}"></td>
            <td class="text-right" th:text="${fmt.money(item.lineTotal)}"></td>
        </tr>
        </tbody>
    </table>
    <table class="totals">
        <tr>
            <td class="label">Tạm tính gian hàng</td>
            <td class="text-right" th:text="${fmt.money(group.subtotal)}"></td>
        </tr>
        <tr>
            <td class="label">Phí vận chuyển</td>
            <td class="text-right" th:text="${fmt.money(group.shippingFee)}"></td>
        </tr>
    </table>
</th:block>

<table class="totals" style="margin-top: 16px;">
    <tr>
        <td class="label">Tạm tính</td>
        <td class="text-right" th:text="${fmt.money(invoice.subtotal)}"></td>
    </tr>
    <tr>
        <td class="label">Phí vận chuyển</td>
        <td class="text-right" th:text="${fmt.money(invoice.shippingFee)}"></td>
    </tr>
    <tr th:if="${invoice.discountAmount.signum() > 0}">
        <td class="label" th:text="'Giảm giá' + (${invoice.discountCode} != null ? ' (' + ${invoice.discountCode} + ')' : '')"></td>
        <td class="text-right" th:text="'-' + ${fmt.money(invoice.discountAmount)}"></td>
    </tr>
    <tr class="grand">
        <td>Tổng cộng</td>
        <td class="text-right" th:text="${fmt.money(invoice.total)}"></td>
    </tr>
</table>

<div class="footer"
     th:text="'Hóa đơn được tạo tự động từ ShopTech — phản ánh trạng thái đơn hàng tại thời điểm xuất (' + ${fmt.dateTime(invoice.issuedAt)} + ').'"></div>
</body>
</html>
